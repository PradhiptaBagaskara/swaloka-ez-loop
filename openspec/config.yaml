context: |
  Swaloka Looping Tool: desktop app for looping a background video over an audio
  playlist, plus channel planning (EZ Loop), packaged for Windows, macOS, and Linux.

  Stack: Tauri v2 with a Rust backend (src-tauri/src) and a Svelte 5 SPA (Vite,
  Tailwind v4, Flowbite Svelte) in src.

  The app provisions its own pinned FFmpeg 8.1.2 build into a per-user folder on
  first run, downloaded from pinned per-platform sources and verified by
  SHA-256; a system FFmpeg installation is never used.

  Language: every user-facing string (labels, dialogs, toasts, log messages) is
  Bahasa Indonesia; OpenSpec artifacts are written in English.

