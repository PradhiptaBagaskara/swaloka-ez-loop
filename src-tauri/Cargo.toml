[package]
name = "swaloka"
version = "1.1.2" # x-release-please-version
description = "Swaloka Looping Tool — desktop FFmpeg automation"
authors = ["Swaloka"]
edition = "2021"

[lib]
name = "swaloka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Pembaruan dari dalam aplikasi: plugin updater + process (relaunch).
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "fs"] }
tokio-util = "0.7"
regex = "1"
rand = "0.9"
lofty = "0.22"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
# Pemasangan FFmpeg dari dalam aplikasi: unduhan sinkron berprogres (ureq
# memakai rustls + ring, jadi tanpa OpenSSL maupun toolchain C tambahan),
# verifikasi hash, dan pembaca arsip .7z murni Rust untuk build Windows.
ureq = { version = "3", features = ["rustls", "gzip"] }
sha2 = "0.10"
sevenz-rust = { version = "0.6", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
