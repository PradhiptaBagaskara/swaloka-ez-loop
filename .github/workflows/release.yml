name: Release

# Rilis otomatis berbasis Release Please + installer Tauri.
#
# - push ke `main`  : Release Please membuat/memperbarui "Release PR" dari
#                     Conventional Commits. Saat PR itu di-merge, tag `v<versi>`
#                     + GitHub Release dibuat, lalu installer di ketiga platform
#                     dibangun dan dilampirkan ke release tersebut.
# - workflow_dispatch: build saja (tanpa publikasi); hasilnya artifact di run
#                     tersebut.
#
# Versi sepenuhnya milik Release Please: ia menaikkan version di package.json
# dan src-tauri/Cargo.toml (via extra-files) di Release PR, dan tauri.conf.json
# mengikuti package.json. Tidak ada langkah yang menyetel versi di workflow ini.
#
# Tag dikelola sepenuhnya oleh Release Please (lihat release-please-config.json
# dan .release-please-manifest.json), jadi jangan push tag manual.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Buat / perbarui Release PR
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  version:
    name: Tentukan mode publikasi
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - name: Baca status rilis
        id: detect
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          {
            echo "version=$RELEASE_VERSION"
            echo "tag_name=$RELEASE_TAG"
            echo "publish=$RELEASE_CREATED"
          } >> "$GITHUB_OUTPUT"
          echo "Versi: ${RELEASE_VERSION:-<none>} | tag=${RELEASE_TAG:-<none>} | publish=${RELEASE_CREATED:-false}"

  build-macos:
    name: macOS
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      artifact-name: swaloka-macos

  build-windows:
    name: Windows
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      artifact-name: swaloka-windows-x64

  build-linux:
    name: Linux
    needs: version
    if: ${{ needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      artifact-name: swaloka-linux-x64

  publish:
    name: Publish GitHub Release
    needs: [version, build-macos, build-windows, build-linux]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tiap artifact tetap di subfoldernya (swaloka-macos-arm64, dst.) supaya
      # latest-json.mjs bisa memasangkan berkas updater dengan berkas .sig-nya.
      - name: Download semua installer
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Susun manifest updater (latest.json)
        env:
          ARTIFACTS_DIR: installers
          VERSION: ${{ needs.version.outputs.version }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag_name }}
        run: node scripts/latest-json.mjs

      # `find -print0 | xargs -0` menangani nama berkas berspasi (mis. .dmg macOS).
      - name: Lampirkan installer + manifest ke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find installers -type f -print0 | xargs -0 gh release upload "${{ needs.version.outputs.tag_name }}" --clobber
          gh release upload "${{ needs.version.outputs.tag_name }}" latest.json --clobber
