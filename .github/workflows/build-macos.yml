name: Build macOS

# Workflow reusable: membangun installer macOS (Apple Silicon + Intel).
# Dipanggil oleh release.yml (rilis dari tag) atau workflow lain (mis. build PR).
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Nama artifact dasar; tiap arsitektur dapat suffix sendiri"
        required: true
        type: string
      version:
        description: "Versi aplikasi. Kosongkan untuk memakai nilai di tauri.conf.json"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Set version
        if: inputs.version != ''
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$APP_VERSION"
          echo "Versi installer: $APP_VERSION"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Bundle .app + .dmg. Signing bersifat ad-hoc (signingIdentity "-") agar
      # app di Apple Silicon tidak dianggap rusak; tanpa notarization, Gatekeeper
      # tetap meminta izin saat pertama dibuka. Kunci privat menandatangani
      # artifact updater (.app.tar.gz.sig).
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      # Nama bawaan `.app.tar.gz` tidak memuat arsitektur, jadi arm64 dan x64
      # akan saling menimpa saat diunggah ke release yang sama. Tambahkan suffiks
      # arsitektur; berkas `.sig` ikut berganti nama agar tetap berpasangan.
      - name: Rename updater artifact
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          for f in "$dir"/*.app.tar.gz; do
            base="${f%.app.tar.gz}"
            mv "$f" "${base}_${{ matrix.arch }}.app.tar.gz"
            mv "$f.sig" "${base}_${{ matrix.arch }}.app.tar.gz.sig"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7
